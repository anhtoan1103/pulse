# Local dev / self-host stack — Postgres + Redis + backend (api + worker,
# same image per docs/pulse-architecture.md #5) + frontend.
#
# Usage: copy `.env.example` to `.env`, fill in values, then `docker compose up`.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Default max_connections (100) isn't enough headroom for backend-worker's
    # own pool (sized off MAX_CONCURRENT_CHECKS, see backend/src/bin/worker.rs)
    # plus backend-api's — 200 comfortably covers both with room for a psql
    # session or two.
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
      POSTGRES_DB: pulse
    ports:
      - "5432:5432"
    volumes:
      - pulse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - pulse_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-api:
    build:
      context: ./backend
    command: ["./api"]
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://pulse:pulse@postgres:5432/pulse
      REDIS_URL: redis://redis:6379
      API_BIND_ADDR: 0.0.0.0:8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend-worker:
    build:
      context: ./backend
    command: ["./worker"]
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://pulse:pulse@postgres:5432/pulse
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      # Baked into the client JS bundle at build time (see frontend/Dockerfile)
      # — a plain `environment:` entry below would only reach server-side code.
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend-api

volumes:
  pulse_postgres_data:
  pulse_redis_data:
